name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PantryMatch.apk

      - name: Save the APK on the build page
        uses: actions/upload-artifact@v4
        with:
          name: PantryMatch-apk
          path: PantryMatch.apk

      - name: Publish the APK as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pantry Match build ${{ github.run_number }}
          files: PantryMatch.apk
